services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hearmeout
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data  # persistent data volume
      - ./backups:/backups                        # local dir for SQL dumps
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d hearmeout"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hearmeout_net

  # Sidecar: runs pg_dump every hour, auto-deletes backups older than 7 days
  postgres-backup:
    image: postgres:15-alpine
    container_name: postgres-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASS}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c "
        while true; do
          BACKUP_FILE=/backups/hearmeout_$$(date +%Y%m%d_%H%M%S).sql;
          pg_dump -h postgres -U root -d hearmeout -F p > $$BACKUP_FILE;
          echo \"Backup created: $$BACKUP_FILE\";
          find /backups -name '*.sql' -mtime +7 -delete;
          echo \"Old backups pruned.\";
          sleep 3600;
        done
      "
    networks:
      - hearmeout_net

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      REDIS_USER: ${REDIS_USER}
      REDIS_PASSWORD: ${REDIS_PASS}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hearmeout_net

  rabbitmq:
    image: rabbitmq:latest
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hearmeout_net

  backend:
    image: ghcr.io/rarestpreet/hearmeout:${IMAGE_TAG:-latest}
    container_name: hearmeout-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hearmeout_net

volumes:
  postgres_data:

networks:
  hearmeout_net:
    name: hearmeout_net

