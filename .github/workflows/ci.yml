name: HearMeOut CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven #reduce latency during build

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw #required to provide maven wrapper script execute permission

      - name: Run Tests
        run: ./mvnw clean test #everyone use same maven version

      - name: Run Spotless Check
        run: mvn spotless:check #checkstyle require custom style file
