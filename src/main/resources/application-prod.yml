spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    hikari:
      connection-timeout: 5000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USER}
      password: ${REDIS_PASS}
      ssl:
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "mappings, health, metrics"