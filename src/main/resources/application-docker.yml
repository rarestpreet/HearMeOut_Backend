spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/hearmeout
    username: root
    password: mysecretpassword
    hikari:
      initialization-fail-timeout: 6000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: redis
      port: 6379

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        include: "*"