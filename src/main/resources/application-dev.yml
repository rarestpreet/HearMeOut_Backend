spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/hearmeout?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASS}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    open-in-view: true

  data:
    redis:
      host: localhost
      port: 6379

cookie:
  creation:
    secure: false
    same-site: Lax

logging:
  level:
    root: info