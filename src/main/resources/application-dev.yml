spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hearmeout?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASS:mysecretpassword}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    open-in-view: true

  data:
    redis:
      host: localhost
      port: 6379

cookie:
  creation:
    secure: false
    same-site: Lax

logging:
  level:
    root: info